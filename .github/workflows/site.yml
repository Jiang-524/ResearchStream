name: Build research journal
on:
  push:
    branches: [main, agent_dev]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: researchstream-${{ github.ref }}
  cancel-in-progress: true
env:
  SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io', github.repository_owner) }}
  BASE_PATH: ${{ vars.BASE_PATH || format('/{0}/', github.event.repository.name) }}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Import daily Markdown from Work
        run: |
          pnpm sync:papers --file inbox/paperinsight/2026-10-08_robot_manipulation_daily.md --update
          pnpm sync:papers
      - run: pnpm check
      - run: pnpm build
      - run: pnpm test
      - name: Save normalized articles
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        run: |
          git add content/paperpost
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'content: import daily paper notes'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: dist
      - uses: actions/upload-pages-artifact@v4
        if: vars.ENABLE_PAGES != 'false' && github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        with:
          path: dist
  deploy:
    if: vars.ENABLE_PAGES != 'false' && github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
