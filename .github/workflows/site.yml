name: Build research journal
on:
  push:
    branches: [main, agent_dev]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: researchstream-${{ github.ref }}
  cancel-in-progress: true
env:
  SITE_URL: ${{ vars.SITE_URL || 'https://example.com' }}
  BASE_PATH: ${{ vars.BASE_PATH || '/' }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm test
      - uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: dist
      - uses: actions/upload-pages-artifact@v3
        if: vars.ENABLE_PAGES == 'true' && github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        with:
          path: dist
  deploy:
    if: vars.ENABLE_PAGES == 'true' && github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
